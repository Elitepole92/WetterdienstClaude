name: Vogel-Lexikon

on:
  schedule:
    # Normalerweise stößt der Wetterlauf (5:45, 11:45, 17:45 Berliner Zeit) den Vogel an.
    # Reserve: alle 15 Minuten prüfen; fehlt der Vogel für ein Zeitfenster noch, wird er
    # zwischen :55 und der folgenden vollen Stunde nachgeholt (vor dem Display-Refresh).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      art:
        description: "Lateinischer Name erzwingen (optional, zum Testen)"
        required: false

permissions:
  contents: write

concurrency:
  group: vogel
  cancel-in-progress: false

jobs:
  vogel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zeitfenster prüfen
        id: fenster
        run: |
          hm=$(TZ=Europe/Berlin date '+%H%M')
          tag=$(TZ=Europe/Berlin date '+%Y-%m-%d')
          case "$hm" in
            055[5-9]|06??) fenster="$tag 05" ;;
            115[5-9]|12??) fenster="$tag 11" ;;
            175[5-9]|18??) fenster="$tag 17" ;;
            *) fenster="" ;;
          esac
          letzter=$(jq -r '.slot // ""' vogel/vogel.json 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "los=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$fenster" ] && [ "$letzter" != "$fenster" ]; then
            echo "Vogel für $fenster Uhr fehlt – Reserve-Lauf."
            echo "los=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nichts zu tun (Berlin $hm, letzter Vogel: $letzter)."
          fi
      - uses: actions/setup-python@v5
        if: steps.fenster.outputs.los == 'true'
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0
        if: steps.fenster.outputs.los == 'true'
      - name: Vogel wählen und Bild setzen
        if: steps.fenster.outputs.los == 'true'
        env:
          ART: ${{ github.event.inputs.art }}
        run: |
          if [ -n "$ART" ]; then python vogel/vogel.py --art "$ART"; else python vogel/vogel.py; fi
      - name: Committen und pushen
        if: steps.fenster.outputs.los == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vogel/vogel.png vogel/vogel.json vogel/tafeln.json
          git diff --cached --quiet && exit 0
          git commit -m "Vogel $(TZ=Europe/Berlin date '+%d.%m. %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
